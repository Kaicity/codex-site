<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Cars Visualization</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://d3js.org/d3.v7.min.js"></script>
  </head>

  <body>
    <h2>Cars Data Visualization</h2>

    <div class="controls">
      <div>
        <h4>Attributes</h4>
        <div class="panel attributes">
          <div class="attr-item" data-value="MPG">
            MPG <span class="order"></span>
          </div>
          <div class="attr-item" data-value="Horsepower">
            Horsepower <span class="order"></span>
          </div>
          <div class="attr-item" data-value="Weight">
            Weight <span class="order"></span>
          </div>
          <div class="attr-item" data-value="Acceleration">
            Acceleration <span class="order"></span>
          </div>
        </div>
      </div>

      <div>
        <h4>Target</h4>
        <div class="panel">
          <label
            ><input type="radio" name="target" value="Manufacturer" checked />
            Manufacturer</label
          >
          <label
            ><input type="radio" name="target" value="Origin" /> Origin</label
          >
        </div>
      </div>
    </div>

    <div class="grid">
      <div class="chart-wrapper" id="scatterWrapper">
        <div class="chart-controls">
          <button class="zoom-in">+</button>
          <button class="zoom-out">-</button>
        </div>
        <div id="scatterChart" class="chart"></div>
      </div>

      <div class="chart-wrapper" id="barWrapper">
        <div class="chart-controls">
          <button class="zoom-in">+</button>
          <button class="zoom-out">-</button>
        </div>
        <div id="barChart" class="chart"></div>
      </div>

      <div class="chart-wrapper" id="parallelWrapper">
        <div class="chart-controls">
          <button class="zoom-in">+</button>
          <button class="zoom-out">-</button>
        </div>
        <div id="parallelChart" class="chart"></div>
      </div>

      <div class="chart-wrapper" id="pieWrapper">
        <div class="chart-controls">
          <button class="zoom-in">+</button>
          <button class="zoom-out">-</button>
        </div>
        <div id="pieChart" class="chart"></div>
      </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
